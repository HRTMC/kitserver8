name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 90
    # The runner has VS 2022, whose own toolset (v143) cannot target Windows XP.
    # So the VS 2017 (v141, MSVC 14.16) toolset and the XP support component are
    # installed next to it, and that toolset does the compiling.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Modifying the runner's preinstalled VS 2022 in place gets cancelled, so
      # the v141 toolset goes into a separate, fresh Build Tools instance
      # (C:\BuildTools) unless some installed instance already has it.
      - name: Find or install the VS 2017 (v141, MSVC 14.16) toolset
        timeout-minutes: 50
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = $null
          foreach ($p in (& $vswhere -all -products * -property installationPath)) {
            Write-Host "VS instance: $p"
            if (Test-Path "$p\VC\Tools\MSVC\14.16*") {
              $vcvars = "$p\VC\Auxiliary\Build\vcvarsall.bat"
              Write-Host "  has the v141 toolset, using it"
              break
            }
          }

          if (-not $vcvars) {
            $exe = Join-Path $env:RUNNER_TEMP 'vs_BuildTools.exe'
            Invoke-WebRequest 'https://aka.ms/vs/17/release/vs_BuildTools.exe' -OutFile $exe

            function Install-BuildTools([string[]] $components) {
              $vsArgs = @('--quiet', '--wait', '--norestart', '--nocache', '--installPath', 'C:\BuildTools')
              foreach ($c in $components) { $vsArgs += @('--add', $c) }
              Write-Host "vs_BuildTools.exe $($vsArgs -join ' ')"
              # No -Wait on Start-Process: it also waits for every child process the
              # installer leaves running in the background, which can hang forever.
              # Wait for the installer process itself and print a heartbeat, because
              # a silent install prints nothing for many minutes.
              $proc = Start-Process $exe -ArgumentList $vsArgs -PassThru
              $null = $proc.Handle   # keeps ExitCode readable after exit
              $script:sw = [Diagnostics.Stopwatch]::StartNew()
              while (-not $proc.WaitForExit(30000)) {
                $last = ''
                try {
                  $log = Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
                  if ($log) { $last = "[$($log.Name)] " + ((Get-Content $log.FullName -Tail 1 -ErrorAction SilentlyContinue) -join '') }
                } catch { }
                Write-Host ("{0:mm\:ss} installer running... {1}" -f $script:sw.Elapsed, $last)
                if ($script:sw.Elapsed.TotalMinutes -gt 40) {
                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                  Write-Warning 'Installer timed out after 40 minutes'
                  return $false
                }
              }
              Write-Host "installer exit code: $($proc.ExitCode) after $($script:sw.Elapsed.ToString('mm\:ss'))"
              # 3010 = success, reboot pending (not needed here)
              return (($proc.ExitCode -in 0, 3010) -and (Test-Path 'C:\BuildTools\VC\Tools\MSVC\14.16*'))
            }

            $ok = Install-BuildTools @('Microsoft.VisualStudio.Component.VC.v141.x86.x64',
                                       'Microsoft.VisualStudio.Component.WinXP')
            if (-not $ok -and $script:sw.Elapsed.TotalMinutes -lt 30) {
              Write-Warning 'Install with the XP support component failed, retrying with the v141 toolset only'
              $ok = Install-BuildTools @('Microsoft.VisualStudio.Component.VC.v141.x86.x64')
            }
            if (-not $ok) {
              Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
                  Write-Host "----- tail of $($_.FullName)"
                  Get-Content $_.FullName -Tail 60
                }
              throw 'Could not install the v141 toolset'
            }
            $vcvars = 'C:\BuildTools\VC\Auxiliary\Build\vcvarsall.bat'
          }
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found: $vcvars" }
          Write-Host "vcvarsall: $vcvars"

          # Run vcvarsall for x86 and carry the resulting environment into the next
          # steps (the same thing ilammy/msvc-dev-cmd does). Its output is NOT hidden.
          # For a side-by-side v141 install it sets up the Windows SDK part of the
          # environment but can skip the compiler part, so the 14.16 folders are
          # added explicitly below instead of trusting it.
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $after = @{}
          $dump = cmd /c "`"$vcvars`" x86 -vcvars_ver=14.16 2>&1 && set"
          foreach ($line in $dump) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { $after[$Matches[1]] = $Matches[2] }
            else { Write-Host "vcvarsall: $line" }
          }
          if ($after.Count -eq 0) { throw 'vcvarsall.bat did not set up an environment' }

          $vcDir = Split-Path (Split-Path (Split-Path $vcvars -Parent) -Parent) -Parent
          Write-Host "VC dir: $vcDir"
          Get-ChildItem "$vcDir\Tools\MSVC" -Directory | ForEach-Object { Write-Host "  toolset folder: $($_.Name)" }
          $tools = (Get-ChildItem "$vcDir\Tools\MSVC" -Directory | Where-Object Name -like '14.16*' | Select-Object -First 1).FullName
          $bin = "$tools\bin\Hostx86\x86"
          if (-not (Test-Path "$bin\cl.exe")) {
            Get-ChildItem "$tools\bin" -Recurse -Filter cl.exe | ForEach-Object { Write-Host "  found: $($_.FullName)" }
            throw "cl.exe not found in $bin"
          }
          function Add-Front([string] $name, [string[]] $dirs) {
            $dirs = $dirs | Where-Object { Test-Path $_ }
            $old = if ($after.ContainsKey($name)) { $after[$name] } else { '' }
            $after[$name] = (($dirs -join ';') + ';' + $old).TrimEnd(';')
          }
          Add-Front 'Path'    @($bin)
          Add-Front 'INCLUDE' @("$tools\include", "$tools\atlmfc\include")
          Add-Front 'LIB'     @("$tools\lib\x86", "$tools\atlmfc\lib\x86")
          $after['VCINSTALLDIR']    = "$vcDir\"
          $after['VCToolsInstallDir'] = "$tools\"

          $n = 0
          foreach ($k in $after.Keys) {
            if ($before[$k] -ne $after[$k]) {
              "$k=$($after[$k])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
              $n++
            }
          }
          Write-Host "compiler: $bin\cl.exe"
          Write-Host "exported $n environment variables"

      - name: Show compiler version
        shell: cmd
        run: |
          where cl
          where nmake
          where link
          where rc
          cl 2>&1 | findstr /i "Version"

      # d3dx9.h / d3dx9.lib (DirectX SDK June 2010) from NuGet. The old SDK
      # installer is unreliable on CI runners.
      - name: Get d3dx9 headers and libs
        shell: pwsh
        run: |
          $dx = Join-Path $env:RUNNER_TEMP 'dx'
          nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory $dx | Out-Null
          $inc = (Get-ChildItem $dx -Recurse -Filter d3dx9.h   | Select-Object -First 1).DirectoryName
          $lib = (Get-ChildItem $dx -Recurse -Filter d3dx9.lib |
                  Where-Object { $_.FullName -match '[\\/]x86[\\/]' } |
                  Select-Object -First 1).DirectoryName
          if (-not $inc -or -not $lib) { throw 'd3dx9 headers/libs not found in NuGet package' }
          Write-Host "include: $inc"
          Write-Host "lib:     $lib"
          "INCLUDE=$inc;$env:INCLUDE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LIB=$lib;$env:LIB"         | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # What the v141_xp platform toolset does in MSBuild: use the Windows 7.1A
      # SDK headers/libs (installed by the XP support component).
      - name: Use the Windows 7.1A SDK (XP-era headers and libs)
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v7.1A"
          if (Test-Path "$sdk\Include\windows.h") {
            Write-Host "7.1A SDK: $sdk"
            "INCLUDE=$sdk\Include;$env:INCLUDE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "LIB=$sdk\Lib;$env:LIB"             | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Warning "Windows 7.1A SDK not found at $sdk; using the Windows 10 SDK headers. The XP compatibility check below still applies."
          }

      # Plain `nmake all` gives the release flags (/DMYDLL_RELEASE_BUILD);
      # `debug=1` would switch to /DDEBUG. Output lands in src\output.
      #
      # MSVC reads the CL environment variable on every compile (also in the
      # nested pngdib build), so no source or Makefile changes are needed:
      #  XP:
      #   /MT                      static CRT, no VC++ redistributable needed on XP
      #   /D_USING_V110_SDK71_     what the *_xp toolsets define (older, XP-safe code paths)
      #   /Zc:threadSafeInit-      thread-safe statics use Vista-only APIs; XP has none
      #  VS2008-era source:
      #   _SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS  hash_map is used all over
      #   _CRT_NON_CONFORMING_SWPRINTFS              old 3-argument swprintf(buf, fmt, ...)
      #   the other two only silence CRT deprecation warnings
      - name: Build
        working-directory: src
        shell: cmd
        env:
          CL: /MT /D_USING_V110_SDK71_ /Zc:threadSafeInit- /D_SILENCE_STDEXT_HASH_DEPRECATION_WARNINGS /D_CRT_NON_CONFORMING_SWPRINTFS /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_WARNINGS
        run: nmake /nologo all

      # The linker marks the files as needing subsystem 6.00 (Vista) by default,
      # and XP then refuses to load them. The Makefile defines its own LINK macro,
      # so the LINK environment variable can't be used; patch the headers instead.
      # Each file keeps its own subsystem (GUI/console), only the version changes.
      # The prebuilt libpng/zlib DLLs are not ours and are left alone.
      - name: Mark binaries as Windows XP (subsystem 5.01)
        working-directory: src/output
        shell: pwsh
        run: |
          $skip = 'libpng13.dll', 'zlib1.dll'
          Get-ChildItem -File | Where-Object { $_.Extension -in '.dll', '.exe' -and $_.Name -notin $skip } | ForEach-Object {
            $hdr = (dumpbin /headers $_.FullName) -join "`n"
            $sub = if ($hdr -match 'subsystem \(Windows CUI\)') { 'CONSOLE' } else { 'WINDOWS' }
            editbin /nologo "/SUBSYSTEM:$sub,5.01" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "editbin failed on $($_.Name)" }
            Write-Host "$($_.Name): $sub,5.01"
          }

      # No XP machine on the runner, so check statically: every binary must
      # declare subsystem 5.01 and must not import a Windows API newer than XP.
      # (Static-CRT code that needs newer APIs resolves them at run time, so it
      # does not show up here, which is what we want.)
      - name: Check Windows XP compatibility
        working-directory: src/output
        shell: pwsh
        run: |
          $skip = 'libpng13.dll', 'zlib1.dll'
          $notOnXp = @(
            'GetTickCount64', 'InitOnceExecuteOnce', 'InitOnceBeginInitialize', 'InitOnceComplete',
            'InitializeConditionVariable', 'SleepConditionVariableCS', 'SleepConditionVariableSRW',
            'WakeConditionVariable', 'WakeAllConditionVariable',
            'InitializeSRWLock', 'AcquireSRWLockExclusive', 'ReleaseSRWLockExclusive',
            'AcquireSRWLockShared', 'ReleaseSRWLockShared',
            'InitializeCriticalSectionEx', 'CreateSymbolicLinkW', 'CreateSymbolicLinkA',
            'GetLocaleInfoEx', 'LCMapStringEx', 'CompareStringEx', 'GetUserDefaultLocaleName',
            'IsValidLocaleName', 'EnumSystemLocalesEx', 'GetDateFormatEx', 'GetTimeFormatEx',
            'GetSystemTimePreciseAsFileTime', 'GetFileInformationByHandleEx', 'SetFileInformationByHandle',
            'GetLogicalProcessorInformationEx', 'SetThreadStackGuarantee', 'CreateThreadpoolWork',
            'GetCurrentProcessorNumberEx', 'QueryUnbiasedInterruptTime', 'GetFinalPathNameByHandleW',
            'RegGetValueW', 'RegGetValueA', 'EventRegister', 'EventWriteTransfer', 'EventUnregister'
          )
          $bad = @()
          Get-ChildItem -File | Where-Object { $_.Extension -in '.dll', '.exe' -and $_.Name -notin $skip } | ForEach-Object {
            $name = $_.Name
            $hdr = (dumpbin /headers $_.FullName) -join "`n"
            if ($hdr -notmatch '5\.01 subsystem version') { $bad += "${name}: subsystem version is not 5.01" }
            $imp = (dumpbin /imports $_.FullName) -join "`n"
            foreach ($fn in $notOnXp) {
              if ($imp -match "(?m)^\s+[0-9A-F]+\s+$fn\s*$") { $bad += "${name}: imports $fn (needs Vista or newer)" }
            }
            Write-Host "checked $name"
          }
          if ($bad) { $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'OK: all binaries declare subsystem 5.01 and import no post-XP APIs from the deny list'

      - name: List output
        shell: pwsh
        run: Get-ChildItem src/output | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: kitserver8-pes2009-winxp
          path: src/output/
          if-no-files-found: error
